<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <ul class="nav">
    <li>1</li>

        }
        const p = document.querySelectorAll('#nav')
        p[0].style.color = 'red'
    </script>
